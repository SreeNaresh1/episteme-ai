<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="680" />
    <line x1="300" y1="0" x2="300" y2="680" />
    <line x1="500" y1="0" x2="500" y2="680" />
    <line x1="700" y1="0" x2="700" y2="680" />
    <line x1="900" y1="0" x2="900" y2="680" />
    <line x1="1100" y1="0" x2="1100" y2="680" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 45)">
    <circle cx="16" cy="16" r="16" fill="#10b981" fill-opacity="0.2" />
    <circle cx="16" cy="16" r="6" fill="#10b981" />
    <text x="44" y="22" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.5">EPISTEME AI — MULTI-AGENT ARCHITECTURE</text>
    <text x="640" y="22" font-size="13" font-weight="500" fill="#94a3b8">Autonomous Self-Healing Curriculum Engine | Agentic AI Hackathon 2026</text>
  </g>

  <!-- ── 1. INTAKE & CONSTRAINTS ───────────────────────────── -->
  <g transform="translate(60, 110)" filter="url(#cardShadow)">
    <rect width="230" height="200" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5" />
    <rect width="230" height="42" rx="12" fill="#1e293b" fill-opacity="0.5" />
    <text x="16" y="26" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.8">01 • GOAL &amp; CONSTRAINTS</text>
    <text x="16" y="70" font-size="14" font-weight="600" fill="#f1f5f9">Learner Ambition Intake</text>
    <text x="16" y="92" font-size="12" fill="#94a3b8">"Become a Data Analyst"</text>
    <line x1="16" y1="110" x2="214" y2="110" stroke="#334155" stroke-width="1" />
    <text x="16" y="132" font-size="12" font-weight="600" fill="#e2e8f0">Constraint Solver Input:</text>
    <text x="16" y="152" font-size="11" fill="#94a3b8">• Weekly Limit: 5h / week</text>
    <text x="16" y="170" font-size="11" fill="#94a3b8">• Horizon: 26 weeks</text>
    <text x="16" y="188" font-size="11" font-weight="700" fill="#10b981">• Total Budget: 130 Hours Cap</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 290 210 L 335 210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ── 2. REASONING & PREREQUISITE DAG ────────────────────── -->
  <g transform="translate(340, 110)" filter="url(#cardShadow)">
    <rect width="250" height="200" rx="12" fill="#131c2e" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="250" height="42" rx="12" fill="url(#primaryGlow)" />
    <text x="16" y="26" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="0.8">02 • REASONING &amp; PREREQUISITES</text>
    <text x="16" y="70" font-size="14" font-weight="600" fill="#f1f5f9">Gemini 2.0 Flash / DAG</text>
    <text x="16" y="92" font-size="12" fill="#94a3b8">Topological Curriculum Graph</text>
    <line x1="16" y1="110" x2="234" y2="110" stroke="#334155" stroke-width="1" />
    <text x="16" y="132" font-size="11" fill="#cbd5e1">1. Foundations (Math/Stats)</text>
    <text x="16" y="150" font-size="11" fill="#cbd5e1">2. Core Python &amp; Data Structures</text>
    <text x="16" y="168" font-size="11" fill="#cbd5e1">3. SQL &amp; Relational Databases</text>
    <text x="16" y="186" font-size="11" fill="#cbd5e1">4. EDA, Pandas, Tableau, Capstone</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 590 210 L 635 210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ── 3. LINK AUDITOR & PAYWALL HEURISTIC ─────────────────── -->
  <g transform="translate(640, 110)" filter="url(#cardShadow)">
    <rect width="260" height="200" rx="12" fill="#131c2e" stroke="#10b981" stroke-width="1.5" />
    <rect width="260" height="42" rx="12" fill="url(#greenGlow)" />
    <text x="16" y="26" font-size="13" font-weight="700" fill="#34d399" letter-spacing="0.8">03 • LINK AUDITOR &amp; PAYWALL</text>
    <text x="16" y="70" font-size="14" font-weight="600" fill="#f1f5f9">Real-Time Verification Agent</text>
    <text x="16" y="92" font-size="12" fill="#94a3b8">Active HTTP Crawler &amp; Classifier</text>
    <line x1="16" y1="110" x2="244" y2="110" stroke="#334155" stroke-width="1" />
    <text x="16" y="132" font-size="11" fill="#e2e8f0">• Ping HTTP Response Codes</text>
    <text x="16" y="150" font-size="11" fill="#ef4444">• Detects 404 &amp; NXDOMAIN Drops</text>
    <text x="16" y="168" font-size="11" fill="#f59e0b">• Heuristic: Flag Paid Platforms (Udemy)</text>
    <text x="16" y="186" font-size="11" fill="#10b981">• Confirms Free Audit (Coursera/Kaggle)</text>
  </g>

  <!-- Branch: Normal Path -> Step 5 -->
  <path d="M 900 210 L 945 210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- ── 4. SELF-HEALING LOOP (LOWER BRANCH) ────────────────── -->
  <!-- Downward Arrow from Step 3 to Step 4 -->
  <path d="M 770 310 L 770 380" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />
  <text x="780" y="350" font-size="11" font-weight="600" fill="#fbbf24">If 404 or Paid</text>

  <g transform="translate(640, 390)" filter="url(#cardShadow)">
    <rect width="260" height="220" rx="12" fill="#191528" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="260" height="42" rx="12" fill="url(#amberGlow)" />
    <text x="16" y="26" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="0.8">04 • AUTONOMOUS SELF-HEALING</text>
    <text x="16" y="70" font-size="14" font-weight="600" fill="#f1f5f9">Automated Substitution Loop</text>
    <text x="16" y="92" font-size="12" fill="#94a3b8">Dynamic Topic-Tagged Pool</text>
    <line x1="16" y1="110" x2="244" y2="110" stroke="#451a03" stroke-width="1" />
    <text x="16" y="132" font-size="11" fill="#fed7aa">1. Query replacement candidate</text>
    <text x="16" y="152" font-size="11" fill="#fed7aa">2. Re-ping candidate link via HTTP</text>
    <text x="16" y="172" font-size="11" fill="#fed7aa">3. Verify free status &amp; topic match</text>
    <text x="16" y="192" font-size="11" font-weight="700" fill="#34d399">4. Hot-swap in DB &amp; store reason</text>
  </g>

  <!-- Re-entry from Step 4 into Step 5 -->
  <path d="M 900 500 L 980 500 L 980 325" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />

  <!-- ── 5. HUMAN-IN-THE-LOOP (HITL) GATEWAY ────────────────── -->
  <g transform="translate(950, 110)" filter="url(#cardShadow)">
    <rect width="190" height="200" rx="12" fill="#131c2e" stroke="#8b5cf6" stroke-width="1.5" />
    <rect width="190" height="42" rx="12" fill="url(#purpleGlow)" />
    <text x="14" y="26" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="0.8">05 • HUMAN GATEWAY</text>
    <text x="14" y="70" font-size="13" font-weight="600" fill="#f1f5f9">Explicit Approval</text>
    <text x="14" y="90" font-size="11" fill="#94a3b8">Safety &amp; Review Barrier</text>
    <line x1="14" y1="108" x2="176" y2="108" stroke="#334155" stroke-width="1" />
    <text x="14" y="130" font-size="11" fill="#e2e8f0">• Review Curriculum</text>
    <text x="14" y="150" font-size="11" fill="#e2e8f0">• Inspect Replacements</text>
    <text x="14" y="170" font-size="11" font-weight="700" fill="#a855f7">• Authorize Dispatch</text>
  </g>

  <!-- Downward Arrow from Step 5 to Step 6 -->
  <path d="M 1045 310 L 1045 380" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ── 6. IDEMPOTENT EXECUTION & CALENDAR ─────────────────── -->
  <g transform="translate(950, 390)" filter="url(#cardShadow)">
    <rect width="190" height="220" rx="12" fill="#131c2e" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="190" height="42" rx="12" fill="#1e293b" />
    <text x="14" y="26" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.8">06 • EXECUTION &amp; CALENDAR</text>
    <text x="14" y="70" font-size="13" font-weight="600" fill="#f1f5f9">Idempotent Engine</text>
    <text x="14" y="90" font-size="11" fill="#94a3b8">RFC-5545 .ics Export</text>
    <line x1="14" y1="108" x2="176" y2="108" stroke="#334155" stroke-width="1" />
    <text x="14" y="130" font-size="11" fill="#38bdf8">• Unique Idempotency Key</text>
    <text x="14" y="150" font-size="11" fill="#94a3b8">• Prevent duplicate runs</text>
    <text x="14" y="170" font-size="11" fill="#94a3b8">• Only missing added</text>
    <text x="14" y="194" font-size="11" font-weight="700" fill="#10b981">• Google/Apple/Outlook</text>
  </g>

  <!-- ── PERSISTENCE TIER (SQLITE WAL) ──────────────────────── -->
  <g transform="translate(60, 390)" filter="url(#cardShadow)">
    <rect width="530" height="220" rx="12" fill="#0d1524" stroke="#334155" stroke-width="1.5" />
    <rect width="530" height="42" rx="12" fill="#1e293b" fill-opacity="0.6" />
    <text x="20" y="26" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="0.8">STATEFUL AUDIT TIER • SQLITE (WAL MODE)</text>
    
    <g transform="translate(20, 60)">
      <rect width="150" height="135" rx="8" fill="#172236" stroke="#334155" />
      <text x="12" y="24" font-size="12" font-weight="700" fill="#60a5fa">Table: runs</text>
      <text x="12" y="46" font-size="10" fill="#94a3b8">id (PK)</text>
      <text x="12" y="64" font-size="10" fill="#94a3b8">goal, level</text>
      <text x="12" y="82" font-size="10" fill="#94a3b8">weekly_hours</text>
      <text x="12" y="100" font-size="10" fill="#94a3b8">horizon_weeks</text>
      <text x="12" y="118" font-size="10" fill="#10b981">status (verified)</text>
    </g>

    <g transform="translate(185, 60)">
      <rect width="150" height="135" rx="8" fill="#172236" stroke="#334155" />
      <text x="12" y="24" font-size="12" font-weight="700" fill="#34d399">Table: resources</text>
      <text x="12" y="46" font-size="10" fill="#94a3b8">id, week_id</text>
      <text x="12" y="64" font-size="10" fill="#94a3b8">url, is_free</text>
      <text x="12" y="82" font-size="10" fill="#94a3b8">link_status (live_free)</text>
      <text x="12" y="100" font-size="10" fill="#f59e0b">replaced_by</text>
      <text x="12" y="118" font-size="10" fill="#94a3b8">classification_reason</text>
    </g>

    <g transform="translate(350, 60)">
      <rect width="160" height="135" rx="8" fill="#172236" stroke="#334155" />
      <text x="12" y="24" font-size="12" font-weight="700" fill="#c084fc">Table: actions &amp; tests</text>
      <text x="12" y="46" font-size="10" fill="#94a3b8">idempotency_key (UQ)</text>
      <text x="12" y="64" font-size="10" fill="#94a3b8">action_type</text>
      <text x="12" y="82" font-size="10" fill="#94a3b8">mock_execution = 1</text>
      <text x="12" y="100" font-size="10" fill="#38bdf8">tc_id (TC1 - TC4)</text>
      <text x="12" y="118" font-size="10" fill="#10b981">evidence (JSON)</text>
    </g>
  </g>

  <!-- Connectors between DB and Engines -->
  <path d="M 640 450 L 590 450" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M 950 550 L 590 550" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Footer Tagline -->
  <text x="60" y="650" font-size="11" fill="#64748b">Episteme AI Engine • Autonomous Link Self-Healing • Multi-Agent Verification • Zero Tuition Guarantee</text>
</svg>
