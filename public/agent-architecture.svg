  <g transform="translate(950, 390)" filter="url(#cardShadow)">
    <rect width="190" height="225" rx="8" fill="#141414" stroke="#333333" stroke-width="1" />
    <rect width="190" height="38" rx="8" fill="#1f1f1f" />
    <text x="14" y="24" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.8">06 • DISPATCH &amp; EXPORT</text>
    <text x="14" y="66" font-size="13" font-weight="600" fill="#ffffff">Idempotent Engine</text>
    <text x="14" y="86" font-size="12" fill="#888888">RFC-5545 .ics Export</text>
    <line x1="14" y1="104" x2="176" y2="104" stroke="#262626" stroke-width="1" />
    <text x="14" y="126" font-size="11" fill="#d4d4d4">• Unique Idempotency Key</text>
    <text x="14" y="146" font-size="11" fill="#d4d4d4">• Prevent duplicate runs</text>
    <text x="14" y="166" font-size="11" fill="#d4d4d4">• Only missing sessions added</text>
    <text x="14" y="186" font-size="11" font-weight="700" fill="#ffffff">• Universal .ics Export</text>
    <text x="14" y="206" font-size="10" fill="#737373">Google/Apple/Outlook</text>
  </g>

  <!-- ── STATEFUL PERSISTENCE TIER (SQLITE WAL) ─────────────── -->
  <g transform="translate(60, 390)" filter="url(#cardShadow)">
    <rect width="530" height="225" rx="8" fill="#121212" stroke="#262626" stroke-width="1" />
    <rect width="530" height="38" rx="8" fill="#191919" />
    <text x="18" y="24" font-size="11" font-weight="700" fill="#e5e5e5" letter-spacing="0.8">STATEFUL AUDIT TIER • SQLITE (WAL MODE)</text>

    <g transform="translate(18, 56)">
      <rect width="150" height="150" rx="6" fill="#161616" stroke="#2b2b2b" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#f5f5f5">Table: runs</text>
      <text x="12" y="44" font-size="10" fill="#888888">id (PK)</text>
      <text x="12" y="64" font-size="10" fill="#888888">goal, level</text>
      <text x="12" y="84" font-size="10" fill="#888888">weekly_hours</text>
      <text x="12" y="104" font-size="10" fill="#888888">horizon_weeks</text>
      <text x="12" y="124" font-size="10" fill="#888888">total_hours</text>
      <text x="12" y="142" font-size="10" font-weight="600" fill="#e5e5e5">status = verified</text>
    </g>

    <g transform="translate(185, 56)">
      <rect width="155" height="150" rx="6" fill="#161616" stroke="#2b2b2b" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#f5f5f5">Table: resources</text>
      <text x="12" y="44" font-size="10" fill="#888888">id, week_id</text>
      <text x="12" y="64" font-size="10" fill="#888888">url, platform</text>
      <text x="12" y="84" font-size="10" fill="#888888">is_free (1/0)</text>
      <text x="12" y="104" font-size="10" fill="#888888">link_status = live_free</text>
      <text x="12" y="124" font-size="10" fill="#888888">replaced_by</text>
      <text x="12" y="142" font-size="10" font-weight="600" fill="#e5e5e5">classification_reason</text>
    </g>

    <g transform="translate(355, 56)">
      <rect width="155" height="150" rx="6" fill="#161616" stroke="#2b2b2b" />
      <text x="12" y="22" font-size="11" font-weight="700" fill="#f5f5f5">Table: actions &amp; tests</text>
      <text x="12" y="44" font-size="10" fill="#888888">idempotency_key (UQ)</text>
      <text x="12" y="64" font-size="10" fill="#888888">action_type</text>
      <text x="12" y="84" font-size="10" fill="#888888">mock_execution = 1</text>
      <text x="12" y="104" font-size="10" fill="#888888">tc_id (TC1 - TC4)</text>
      <text x="12" y="124" font-size="10" fill="#888888">status = passed</text>
      <text x="12" y="142" font-size="10" font-weight="600" fill="#e5e5e5">evidence (JSON)</text>
    </g>
  </g>

  <!-- Connectors between DB and Modules -->
  <path d="M 640 460 L 590 460" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M 950 560 L 590 560" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Footer Tagline -->
  <text x="60" y="650" font-size="11" fill="#666666" letter-spacing="0.2">Episteme AI Engine • Autonomous Link Auditing • Multi-Agent Verification • Zero Tuition Guarantee</text>
</svg>
