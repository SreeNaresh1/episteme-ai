<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0e0e0e;font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans','Inter',Helvetica,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#888888" />
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e5e5e5" />
    </marker>
  </defs>

  <!-- Subtle Minimalist Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="680" />
    <line x1="240" y1="0" x2="240" y2="680" />
    <line x1="400" y1="0" x2="400" y2="680" />
    <line x1="560" y1="0" x2="560" y2="680" />
    <line x1="720" y1="0" x2="720" y2="680" />
    <line x1="880" y1="0" x2="880" y2="680" />
    <line x1="1040" y1="0" x2="1040" y2="680" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="520" x2="1200" y2="520" />
  </g>

  <!-- Header Section (Clean Monochrome) -->
  <g transform="translate(60, 42)">
    <!-- Minimalist Constellation Glyph -->
    <circle cx="14" cy="14" r="14" fill="#202020" stroke="#333333" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#f5f5f5" />
    <circle cx="14" cy="5" r="1.5" fill="#a3a3a3" />
    <circle cx="21" cy="8" r="1.5" fill="#a3a3a3" />
    <circle cx="23" cy="14" r="1.5" fill="#a3a3a3" />
    <circle cx="21" cy="20" r="1.5" fill="#a3a3a3" />
    <circle cx="14" cy="23" r="1.5" fill="#a3a3a3" />
    <circle cx="7" cy="20" r="1.5" fill="#a3a3a3" />
    <circle cx="5" cy="14" r="1.5" fill="#a3a3a3" />
    <circle cx="7" cy="8" r="1.5" fill="#a3a3a3" />

    <text x="40" y="20" font-size="20" font-weight="700" fill="#f5f5f5" letter-spacing="0.4">EPISTEME AI — MULTI-AGENT ARCHITECTURE</text>
    <text x="660" y="20" font-size="12" font-weight="500" fill="#888888" letter-spacing="0.3">AUTONOMOUS CURRICULUM ENGINE • 2026</text>
  </g>

  <!-- ── 01. GOAL & CONSTRAINTS ───────────────────────────── -->
  <g transform="translate(60, 95)" filter="url(#cardShadow)">
    <rect width="230" height="215" rx="8" fill="#141414" stroke="#282828" stroke-width="1" />
    <rect width="230" height="38" rx="8" fill="#1b1b1b" />
    <text x="16" y="24" font-size="11" font-weight="700" fill="#e5e5e5" letter-spacing="0.8">01 • GOAL &amp; CONSTRAINTS</text>
    <text x="16" y="66" font-size="13" font-weight="600" fill="#ffffff">Learner Ambition Intake</text>
    <text x="16" y="86" font-size="12" fill="#888888">"Become a Data Analyst"</text>
    <line x1="16" y1="104" x2="214" y2="104" stroke="#262626" stroke-width="1" />
    <text x="16" y="126" font-size="11" font-weight="600" fill="#d4d4d4">Mathematical Solver:</text>
    <text x="16" y="146" font-size="11" fill="#888888">• Weekly Cap: 5 hours / week</text>
    <text x="16" y="164" font-size="11" fill="#888888">• Time Horizon: 26 weeks</text>
    <text x="16" y="184" font-size="11" font-weight="700" fill="#f5f5f5">• Total Budget: 130 Hours Exact</text>
    <text x="16" y="202" font-size="10" fill="#737373">Constraint strictly enforced</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 290 202 L 335 202" stroke="#525252" stroke-width="1.5" marker-end="url(#arrowGray)" />

  <!-- ── 02. REASONING & PREREQUISITES ────────────────────── -->
  <g transform="translate(340, 95)" filter="url(#cardShadow)">
    <rect width="250" height="215" rx="8" fill="#141414" stroke="#282828" stroke-width="1" />
    <rect width="250" height="38" rx="8" fill="#1b1b1b" />
    <text x="16" y="24" font-size="11" font-weight="700" fill="#e5e5e5" letter-spacing="0.8">02 • REASONING &amp; PREREQUISITES</text>
    <text x="16" y="66" font-size="13" font-weight="600" fill="#ffffff">Gemini 2.0 Flash Engine</text>
    <text x="16" y="86" font-size="12" fill="#888888">Topological Curriculum DAG</text>
    <line x1="16" y1="104" x2="234" y2="104" stroke="#262626" stroke-width="1" />
    <text x="16" y="126" font-size="11" fill="#d4d4d4">1. Foundations (Math &amp; Stats)</text>
    <text x="16" y="146" font-size="11" fill="#d4d4d4">2. Core Python &amp; Data Structures</text>
    <text x="16" y="166" font-size="11" fill="#d4d4d4">3. SQL &amp; Relational Databases</text>
    <text x="16" y="186" font-size="11" fill="#d4d4d4">4. EDA, Pandas, Tableau, Capstone</text>
    <text x="16" y="204" font-size="10" fill="#737373">Strict prerequisite order</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 590 202 L 635 202" stroke="#525252" stroke-width="1.5" marker-end="url(#arrowGray)" />

  <!-- ── 03. LINK AUDITOR & PAYWALL HEURISTICS ─────────────── -->
  <g transform="translate(640, 95)" filter="url(#cardShadow)">
    <rect width="260" height="215" rx="8" fill="#141414" stroke="#333333" stroke-width="1" />
    <rect width="260" height="38" rx="8" fill="#1f1f1f" />
    <text x="16" y="24" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.8">03 • LINK AUDIT &amp; PAYWALL</text>
    <text x="16" y="66" font-size="13" font-weight="600" fill="#ffffff">Active HTTP Crawler</text>
    <text x="16" y="86" font-size="12" fill="#888888">Heuristic Status Classifier</text>
    <line x1="16" y1="104" x2="244" y2="104" stroke="#262626" stroke-width="1" />
    <text x="16" y="126" font-size="11" fill="#d4d4d4">• Real-time HTTP header checks</text>
    <text x="16" y="146" font-size="11" fill="#d4d4d4">• Detects 404 &amp; NXDOMAIN errors</text>
    <text x="16" y="166" font-size="11" fill="#d4d4d4">• Detects Paid Subscriptions (Udemy)</text>
    <text x="16" y="186" font-size="11" fill="#d4d4d4">• Validates Free Audits (Coursera)</text>
    <text x="16" y="204" font-size="10" fill="#737373">Deterministic zero-cost rule</text>
  </g>

  <!-- Flow 3 -> 5 (Clean path) -->
  <path d="M 900 202 L 945 202" stroke="#e5e5e5" stroke-width="1.5" marker-end="url(#arrowWhite)" />

  <!-- ── 04. AUTONOMOUS SELF-HEALING (MONOCHROME) ──────────── -->
  <path d="M 770 310 L 770 380" stroke="#737373" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowGray)" />
  <text x="780" y="348" font-size="10" font-weight="600" fill="#a3a3a3">If 404 / Paid Detected</text>

  <g transform="translate(640, 390)" filter="url(#cardShadow)">
    <rect width="260" height="225" rx="8" fill="#141414" stroke="#383838" stroke-width="1" />
    <rect width="260" height="38" rx="8" fill="#1c1c1c" />
    <text x="16" y="24" font-size="11" font-weight="700" fill="#f5f5f5" letter-spacing="0.8">04 • AUTONOMOUS SELF-HEALING</text>
    <text x="16" y="66" font-size="13" font-weight="600" fill="#ffffff">Automated Replacement Loop</text>
    <text x="16" y="86" font-size="12" fill="#888888">Topic-Tagged Repository Pool</text>
    <line x1="16" y1="104" x2="244" y2="104" stroke="#262626" stroke-width="1" />
    <text x="16" y="126" font-size="11" fill="#d4d4d4">1. Query matching free candidate</text>
    <text x="16" y="146" font-size="11" fill="#d4d4d4">2. Re-ping replacement via HTTP</text>
    <text x="16" y="166" font-size="11" fill="#d4d4d4">3. Verify free status &amp; relevance</text>
    <text x="16" y="186" font-size="11" font-weight="700" fill="#ffffff">4. Hot-swap in DB &amp; store reason</text>
    <text x="16" y="206" font-size="10" fill="#737373">Audit lineage preserved in SQLite</text>
  </g>

  <!-- Re-entry from Step 4 into Step 5 -->
  <path d="M 900 502 L 980 502 L 980 325" stroke="#737373" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowGray)" />

  <!-- ── 05. HUMAN GATEWAY ─────────────────────────────────── -->
  <g transform="translate(950, 95)" filter="url(#cardShadow)">
    <rect width="190" height="215" rx="8" fill="#141414" stroke="#282828" stroke-width="1" />
    <rect width="190" height="38" rx="8" fill="#1b1b1b" />
    <text x="14" y="24" font-size="11" font-weight="700" fill="#e5e5e5" letter-spacing="0.8">05 • HUMAN GATEWAY</text>
    <text x="14" y="66" font-size="13" font-weight="600" fill="#ffffff">Explicit Approval</text>
    <text x="14" y="86" font-size="12" fill="#888888">Safety &amp; Review Barrier</text>
    <line x1="14" y1="104" x2="176" y2="104" stroke="#262626" stroke-width="1" />
    <text x="14" y="126" font-size="11" fill="#d4d4d4">• Inspect Curriculum</text>
    <text x="14" y="146" font-size="11" fill="#d4d4d4">• Review Replacements</text>
    <text x="14" y="166" font-size="11" fill="#d4d4d4">• Check Total Hours</text>
    <text x="14" y="188" font-size="11" font-weight="700" fill="#ffffff">• Authorize Dispatch</text>
    <text x="14" y="206" font-size="10" fill="#737373">Zero blind execution</text>
  </g>

  <!-- Flow 5 -> 6 -->
  <path d="M 1045 310 L 1045 380" stroke="#525252" stroke-width="1.5" marker-end="url(#arrowGray)" />

